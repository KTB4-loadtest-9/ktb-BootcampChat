# Server Configuration
server.port=${PORT:5001}

# Spring Boot uses virtual threads for managed request and task execution.
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED:true}
server.tomcat.accept-count=10
server.tomcat.max-connections=100

# Database Configuration
# Spring Boot 4: connection settings moved from spring.data.mongodb.* to spring.mongodb.*
spring.mongodb.uri=${MONGO_URI}
app.mongo.max-pool-size=${MONGO_MAX_POOL_SIZE:120}
spring.data.mongodb.auto-index-creation=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
app.session.store=${SESSION_STORE:redis}

app.message-cache.enabled=${MESSAGE_CACHE_ENABLED:true}
app.message-cache.ttl=${MESSAGE_CACHE_TTL:PT10M}
app.message-cache.lock-wait=${MESSAGE_CACHE_LOCK_WAIT:PT2S}
app.message-cache.lock-lease=${MESSAGE_CACHE_LOCK_LEASE:PT30S}

# File Upload Configuration
# Storage type: local or gridfs (default: local)
file.storage.type=${FILE_STORAGE_TYPE:local}
file.upload-dir=./uploads
file.direct-upload.presign-ttl=${DIRECT_UPLOAD_PRESIGN_TTL:PT10M}
file.cloudfront.signed-url-ttl=${CLOUDFRONT_SIGNED_URL_TTL:PT5M}
file.s3.bucket=${AWS_S3_BUCKET:}
file.s3.region=${AWS_REGION:ap-northeast-2}
file.cloudfront.domain=${AWS_CLOUDFRONT_DOMAIN:}
file.cloudfront.key-pair-id=${AWS_CLOUDFRONT_KEY_PAIR_ID:}
file.cloudfront.private-key-path=${AWS_CLOUDFRONT_PRIVATE_KEY_PATH:}
file.cloudfront.distribution-id=${AWS_CLOUDFRONT_DISTRIBUTION_ID:}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-http-form-post-size=6MB

# Security Configuration
app.encryption.key=${ENCRYPTION_KEY:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
app.encryption.salt=${ENCRYPTION_SALT:3132333435363738}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:your_openai_api_key_here}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.7}

# Socket.IO Server Configuration
socketio.server.host=0.0.0.0
socketio.server.port=${WS_PORT:5002}
socketio.server.origin=${SOCKETIO_SERVER_ORIGIN:*}
socketio.server.boss-threads=${SOCKETIO_BOSS_THREADS:1}
socketio.server.worker-threads=${SOCKETIO_WORKER_THREADS:32}
socketio.store=${SOCKETIO_STORE:redisson}
socketio.redis.host=${PUBSUB_REDIS_HOST:${REDIS_HOST:localhost}}
socketio.redis.port=${PUBSUB_REDIS_PORT:${REDIS_PORT:6379}}
socketio.redis.password=${PUBSUB_REDIS_PASSWORD:${REDIS_PASSWORD:}}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.ktb.chatapp=INFO
logging.level.org.mongodb=INFO

# Content Moderation
chatapp.banned-word.location=classpath:fake_banned_words_10k.txt

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.packages-to-scan=com.ktb.chatapp.controller
springdoc.paths-to-match=/api/**
springdoc.show-actuator=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.access.default=read-only
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name:ktb-chat-backend}
management.metrics.tags.host=${HOSTNAME:unknown}
