name: Backend PR Cloud Deploy Smoke Test

run-name: >-
  Backend cloud deploy smoke test ·
  ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}

on:
  # The workflow definition is read from main, so a PR cannot replace the
  # commands that run on the self-hosted Monitoring EC2.
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - apps/backend/**
      - .github/workflows/backend-pr-cloud-loadtest.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# The Monitoring EC2 and backend deployment hosts are shared resources.
concurrency:
  group: ktb-cloud-loadtest
  cancel-in-progress: false

env:
  BUILD_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
  BE_DEPLOY_HOSTS: ${{ vars.BE_DEPLOY_HOSTS }}
  GRAFANA_URL: ${{ vars.GRAFANA_URL }}
  REMOTE_DIR: /home/ubuntu/ktb-chat-backend/target
  JAR_NAME: ktb-chat-backend-0.0.1-SNAPSHOT.jar
  SERVICE_NAME: ktb-backend
  HEALTH_URL: http://localhost:5001/api/health

jobs:
  build:
    name: Build PR backend JAR
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Package backend
        working-directory: apps/backend
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Prepare deploy artifact
        run: |
          set -Eeuo pipefail
          mkdir -p deploy-artifact
          test -s "apps/backend/target/${JAR_NAME}"
          cp "apps/backend/target/${JAR_NAME}" deploy-artifact/backend-pr.jar
          (cd deploy-artifact && sha256sum backend-pr.jar > backend-pr.jar.sha256)

      - name: Upload backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-pr-jar-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-artifact/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy PR JAR from Monitoring EC2
    needs: build
    runs-on:
      - self-hosted
      - linux
      - x64
      - ktb-ci
    timeout-minutes: 15
    steps:
      - name: Validate deployment configuration
        run: |
          set -Eeuo pipefail
          if [[ -z "${BE_DEPLOY_HOSTS// }" ]]; then
            echo 'Repository variable BE_DEPLOY_HOSTS is required.' >&2
            exit 1
          fi
          for host in ${BE_DEPLOY_HOSTS}; do
            if [[ ! "$host" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid SSH host alias: $host" >&2
              exit 1
            fi
          done

      - name: Download backend JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-pr-jar-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-artifact

      - name: Verify backend JAR
        working-directory: deploy-artifact
        run: sha256sum --check backend-pr.jar.sha256

      - name: Back up and deploy to backend hosts
        run: |
          set -Eeuo pipefail
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          incoming="/tmp/${JAR_NAME}.ci-${run_key}"

          for host in ${BE_DEPLOY_HOSTS}; do
            echo "Deploying tested JAR to ${host}"
            scp \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              deploy-artifact/backend-pr.jar \
              "${host}:${incoming}"

            ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              "$host" \
              bash -s -- \
              "$REMOTE_DIR" "$JAR_NAME" "$SERVICE_NAME" "$HEALTH_URL" "$run_key" "$incoming" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          remote_dir="$1"
          jar_name="$2"
          service_name="$3"
          health_url="$4"
          run_key="$5"
          incoming="$6"
          active_jar="${remote_dir}/${jar_name}"
          backup_jar="${active_jar}.ci-backup-${run_key}"
          staged_jar="${active_jar}.ci-new-${run_key}"

          test -s "$active_jar"
          test -s "$incoming"
          sudo -n cp -p "$active_jar" "$backup_jar"
          sudo -n install -o ubuntu -g ubuntu -m 0644 "$incoming" "$staged_jar"
          sudo -n mv -f "$staged_jar" "$active_jar"
          rm -f "$incoming"
          sudo -n systemctl restart "$service_name"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 "$health_url" >/dev/null; then
              echo "${service_name} is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "${service_name} did not become healthy" >&2
          exit 1
          REMOTE_SCRIPT
          done

      - name: Add Grafana start annotation
        if: ${{ env.GRAFANA_URL != '' }}
        continue-on-error: true
        env:
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
        run: |
          if [[ -z "$GRAFANA_API_TOKEN" ]]; then
            echo 'GRAFANA_API_TOKEN is not configured; skipping annotation.'
            exit 0
          fi
          body=$(printf \
            '{"tags":["github-actions","cloud-deploy-smoke"],"text":"Deploy smoke start · run %s · commit %s"}' \
            "$GITHUB_RUN_ID" "$BUILD_REF")
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GRAFANA_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$body" \
            "${GRAFANA_URL%/}/api/annotations" >/dev/null

  rollback:
    name: Restore original backend JAR
    needs: deploy
    if: ${{ always() && needs.deploy.result != 'skipped' }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - ktb-ci
    timeout-minutes: 15
    steps:
      - name: Restore every backend host that has a backup
        run: |
          set -uo pipefail
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rollback_failed=0

          for host in ${BE_DEPLOY_HOSTS}; do
            echo "Checking rollback backup on ${host}"
            if ! ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              "$host" \
              bash -s -- \
              "$REMOTE_DIR" "$JAR_NAME" "$SERVICE_NAME" "$HEALTH_URL" "$run_key" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          remote_dir="$1"
          jar_name="$2"
          service_name="$3"
          health_url="$4"
          run_key="$5"
          active_jar="${remote_dir}/${jar_name}"
          backup_jar="${active_jar}.ci-backup-${run_key}"
          staged_jar="${active_jar}.ci-restore-${run_key}"
          incoming="/tmp/${jar_name}.ci-${run_key}"

          rm -f "$incoming"
          sudo -n rm -f "${active_jar}.ci-new-${run_key}"
          if [[ ! -s "$backup_jar" ]]; then
            echo 'No backup for this run; nothing to restore'
            exit 0
          fi

          sudo -n install -o ubuntu -g ubuntu -m 0644 "$backup_jar" "$staged_jar"
          sudo -n mv -f "$staged_jar" "$active_jar"
          sudo -n systemctl restart "$service_name"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 "$health_url" >/dev/null; then
              sudo -n rm -f "$backup_jar"
              echo 'Original JAR restored and backup removed'
              exit 0
            fi
            sleep 2
          done

          echo "Restored service did not become healthy; backup retained at ${backup_jar}" >&2
          exit 1
          REMOTE_SCRIPT
            then
              rollback_failed=1
            fi
          done

          exit "$rollback_failed"

      - name: Add Grafana end annotation
        if: ${{ always() && env.GRAFANA_URL != '' }}
        continue-on-error: true
        env:
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
        run: |
          if [[ -z "$GRAFANA_API_TOKEN" ]]; then
            echo 'GRAFANA_API_TOKEN is not configured; skipping annotation.'
            exit 0
          fi
          body=$(printf \
            '{"tags":["github-actions","cloud-deploy-smoke"],"text":"Deploy smoke end / rollback attempted · run %s · commit %s"}' \
            "$GITHUB_RUN_ID" "$BUILD_REF")
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GRAFANA_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$body" \
            "${GRAFANA_URL%/}/api/annotations" >/dev/null
